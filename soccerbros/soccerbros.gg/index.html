    <script>
        function initEventListeners() {
            window.addEventListener('touchmove', (e) => e.preventDefault(), { capture: false, passive: false });
            window.addEventListener('keydown', (e) => {
                var tag = e.target.tagName;
                if (tag !== 'INPUT' && tag !== 'TEXTAREA') e.preventDefault();
            });
            if (window.devicePixelRatio > 2) {
                document.getElementById('viewport').setAttribute('content', `width=device-width, initial-scale=${2 / window.devicePixelRatio}, user-scalable=no`);
            }
            var el = document.getElementById('openfl-content');
            if (el) {
                el.addEventListener('blur', () => el.focus());
                el.addEventListener('focusout', () => el.focus());
            }
        }

        var aCo = "US";

        // The game injects aiptag.cmd.display.push(...) into ad unit divs via
        // Main.ShowAd; keep a benign queue so that never throws (nothing ever
        // drains it). aipDisplayTag is intentionally NOT defined - the game
        // guards every call site with typeof checks, so leaving it undefined
        // skips the ad plumbing entirely.
        window.aiptag = window.aiptag || { cmd: { display: [], player: [] } };

        // Firebase removed: stub the two functions the game reads from its
        // Save/Log-in menu so they never throw.

            if (typeof Main !== 'undefined' && Main.DoneVideoAd) {

        function HideAllAds(hideSides) {}

        function HideAd(divName, justClear) {
            if (justClear === undefined) justClear = false;
            var aDiv = document.getElementById(divName);
            if (aDiv != null) {
                if (!justClear) {
                    aDiv.style.display = "none";
                    aDiv.style.visibility = "hidden";

        function GamePlayStart() {}

        function updateStatus(fromEvent) {}

        function SendEvent(theEvent, theAction, theParms) {
            if (theParms == '') {
                gtag(theEvent, theAction);
            } else {
                gtag(theEvent, theAction, theParms);
            }
            updateStatus(true);
        }

        initEventListeners();
    </script>

    <script>
        window.__tideJoinDebug = true;
        window.addEventListener('message', function(ev) {
            var d;
            try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch(e) { return; }
            if (!d || !d.__tide_join) return;
            var words = String(d.__tide_join);
            var attempts = 0, started = false;
            function doJoin() {
                if (started) return;
                if (++attempts > 600) { console.log('[tide-join] gave up after 600 retries (2.5min)'); return; }
                try {
                    if (window.__tideBridge && typeof window.__tideBridge === 'function') {
                        window.__tideBridge('join', words);
                    }
                } catch(e) {}
                var M = window.Main;
                var children = (M && M.children && M.children.length) ? M.children : null;
                if (!children && M && M.thisMain && M.thisMain.children && M.thisMain.children.length) {
                    children = M.thisMain.children;
                }
                if (!children && M && document.querySelector('canvas')) {
                    try { document.querySelector('canvas').click(); } catch(e) {}
                }
                if (!children) { setTimeout(doJoin, 250); return; }
                for (var i = 0; i < children.length; i++) {
                    var ts = children[i];
                    if (ts && typeof ts.StartOnlineGame === 'function') {
                        console.log('[tide-join] SUCCESS calling StartOnlineGame with: ' + words);
                        started = true;
                        ts.StartOnlineGame(words);
                        return;
                    }
                }
                setTimeout(doJoin, 250);
            }
            doJoin();
        });
        console.log('[tide-join] listener registered');
    </script>
