        var game = {
            title: "Moto X3M",

            enDescription: "It's a sunny day. How about a pleasant little motorcycle ride on the beach? What could possibly go wrong?! Try to complete each level as quickly as you can (doing stunts will help you) and grab all those stars!",

            arDescription: "إنه يوم مشمس. ماذا عن رحلة دراجة نارية ممتعة على الشاطئ؟ ماذا يمكن أن يحدث خطأ؟! حاول إكمال كل مستوى بأسرع ما يمكن (ستساعدك الحركات) واحصل على كل تلك النجوم!",
            azDescription: "Günəşli bir gündür. Strandda xoş bir motosiklet gəzintisi necədir? Nəsə ola bilərdi?! Hər bir səviyyəni mümkün qədər tez başa çatdırmağa çalışın (fiqurlar sizə kömək edəcək) və bütün ulduzları tutun!",
            bgDescription: "Слънчев ден е. Какво ще кажете за приятна разходка с мотоциклет на плажа? Какво би могло да се обърка?! Опитайте се да завършите всяко ниво възможно най-бързо (каскадите ще ви помогнат) и да съберете всички звезди!",
            bsDescription: "Sunčani je dan. Šta kažete za prijatanu malu vožnju motorciklom na plaži? Šta bi eventualno moglo poći pogrešno?! Pokušajte da što brže završite svaki nivo (trikovi će vam pomoći) i pograbite sve te zvezde!",
            caDescription: "És un dia assoleiat. Què tal una passejada agradable amb motocicleta per la platja? Què pot anar malament? Intenta completar cada nivell el més ràpid que puguis (fer acrobàcies t'ajudarà) i agafa totes les estrelles!",
            csDescription: "Je krásný slunečný den. Co takhle příjemná projížďka na motorce po pláži? Co by se mohlo pokazit?! Zkuste dokončit každou úroveň co nejrychleji (pomohou vám kousky) a sebrat všechny ty hvězdy!",
            daDescription: "Det er en solskinsdag. Hvad med en hyggelig lille motorcykeltur på stranden? Hvad kunne der gå galt?! Prøv at gennemføre hvert niveau så hurtigt du kan (udførsel af stunts vil hjælpe dig) og grib alle de stjerner!",
            deDescription: "Es ist ein sonniger Tag. Wie wäre es mit einer schönen kleinen Motorradfahrt am Strand? Was könnte da schon schiefgehen?! Versuche jedes Level so schnell wie möglich abzuschließen (Stunts helfen dir dabei) und schnapp dir all die Sterne!",
            elDescription: "Είναι μια ηλιόλουστη μέρα. Τι θα λέγατε για μια ευχάριστη βόλτα με μηχανή στην παραλία; Τι θα μπορούσε να πάει στραβά; Προσπαθήστε να ολοκληρώσετε κάθε επίπεδο όσο πιο γρήγορα μπορείτε (τα κόλπα θα σας βοηθήσουν) και πιάστε όλα τα αστέρια!",
            esDescription: "Es un día soleado. ¿Qué tal un agradable paseo en moto por la playa? ¡¿Qué podría salir mal?! Intenta completar cada nivel lo más rápido que puedas (las acrobacias te ayudarán) y ¡coge todas esas estrellas!",
            etDescription: "On päikeseline päev. Mis sa arvad, meeldiv mootorrattasõit rannas? Mis võiks valesti minna?! Püüa iga taset võimalikult kiiresti läbida (trikid aitavad sind) ja saada kõik need tähed kätte!",

            faDescription: "یک روز آفتابی است. یک موتور سواری کوچک و دلپذیر در ساحل چطور؟ چه چیزی ممکن است اشتباه باشد؟! سعی کنید هر سطح را با بیشترین سرعتی که می توانید کامل کنید (انجام شیرین کاری به شما کمک می کند) و تمام آن ستاره ها را بگیرید!",
            frDescription: "Il fait beau aujourd'hui. Que diriez-vous d'une petite balade à moto agréable sur la plage ? Qu'est-ce qui pourrait mal se passer ?! Essayez de terminer chaque niveau le plus rapidement possible (faire des cascades vous aidera) et attrapez toutes ces étoiles !",
            fiDescription: "On aurinkoinen päivä. Miltä kuulostaisi miellyttävä moottoripyöräajo rannalla? Mikä voisi mennä pieleen?! Yritä suorittaa jokainen taso mahdollisimman nopeasti (temppujen tekeminen auttaa sinua) ja nappaa kaikki tähdet!",
            faDescription: "یک روز آفتابی است. به یک موتور سواری لذت بخش در ساحل چطور؟ چه چیزی ممکن است اشتباه پیش برود؟! سعی کنید هر مرحله را تا حد امکان سریع کامل کنید (انجام حرکات نمایشی به شما کمک می کند) و تمام آن ستاره ها را بگیرید!",
            hiDescription: "एक सुहाना दिन है। समुद्र तट पर एक सुखद छोटी मोटरसाइकिल की सवारी कैसी रहेगी? क्या गलत हो सकता है ?! प्रत्येक स्तर को जितनी जल्दी हो सके पूरा करने का प्रयास करें (स्टंट करने से आपको मदद मिलेगी) और उन सभी सितारों को पकड़ें!",
            hrDescription: "Sunčan je dan. Šta kažete za prijatan malu vožnju motorciklom na plaži? Što bi se eventualno moglo pogrešiti?! Pokušajte svaku razinu završiti što brže možete (izvođenje trikova će vam pomoći) i pobacite sve te zvijezde!",
            huDescription: "Naposütött nap van. Mi lenne egy kellemes kis motorozással a strandon? Mi baj lehet? Próbáld meg minden szintet a lehető leggyorsabban teljesíteni (a trükkök segítenek), és szerezd meg az összes csillagot!",
            hyDescription: "Արևոտ օր է։ Ինչպես կամ ափին հաճելի փոքր մոտոցիկլետի պտույտ: Ինչ կարող է սխալ լինել?! Շտապով ավարտեք յուրաքանչյուր մակարդակ (ակրոբատիկան ձեզ կօգնի) և բռնեք բոլոր աստղերը!",
            idDescription: "Hari yang cerah. Bagaimana kalau jalan-jalan santai dengan sepeda motor di pantai? Apa yang bisa salah?! Cobalah untuk menyelesaikan setiap level secepat mungkin (melakukan aksi akan membantu Anda) dan ambil semua bintang itu!",
            itDescription: "È una bella giornata. Che ne dici di un piacevole giro in moto in spiaggia? Cosa potrebbe mai andare storto?! Cerca di completare ogni livello il più velocemente possibile (fare acrobazie ti aiuterà) e raccogli tutte quelle stelle!",
            jaDescription: "今日は晴天です。 ビーチでの楽しいバイクライドはどうですか？ 何が問題になるでしょうか？ できるだけ早く各レベルをクリアし (スタントを行うと役立ちます) すべての星をつかみましょう!",

            kaDescription: "მზიანი დღეა. რას იტყვით სანაპიროზე სასიამოვნო პატარა მოტოციკლით გასეირნებაზე? რა შეიძლება იყოს არასწორი?! შეეცადეთ დაასრულოთ თითოეული დონე რაც შეიძლება სწრაფად (ტრიუკების გაკეთება დაგეხმარებათ) და აითვისეთ ყველა ეს ვარსკვლავი!",

            koDescription: "날씨가 맑네요. 해변에서 유쾌한 오토바이 타기는 어떨까요? 무엇이 잘못될 수 있을까요?! 가능한 빨리 각 레벨을 완료하고 (스턴트는 도움이 됩니다) 모든 별을 획득하세요!",
            ltDescription: "Nuostabi diena. Kaip būtų malonus pasivažinėjimas motociklu paplūdimyje? Kas galėtų nutikti blogo?! Stenkitės kuo greičiau įveikti kiekvieną lygį (triukai jums padės) ir surinkite visas žvaigždes!",
            lvDescription: "Saulaina diena. Kā būtu ar jauku brauciens ar pludmalē ar motociklu? Kas varētu noiet greizi? Centieties pēc iespējas ātrāk pabeigt katru līmeni (triki jums palīdzēs) un savākt visas zvaigznes!",
            mkDescription: "Сончев ден е. Што би рекле за пријатна моторциклистичка возилка по плажа? Што може да се случи лошо?! Обидете се што е можно побрзо да ги поминете нивоата (правењето фориќи ќе ви помогне) и земете ги сите ѕвезди!",
            msDescription: "Hari yang cerah. Bagaimana dengan perjalanan motosikal yang menyenangkan di pantai? Apa yang boleh salah?! Cuba selesaikan setiap peringkat secepat mungkin (buat aksi untuk membantu anda) dan dapatkan semua bintang itu!",
            nbDescription: "En nydelig dag. Hva med en hyggelig motorsykkeltur på stranden? Hva kan muligens gå galt?! Prøv å fullføre hvert nivå så raskt du kan (å gjøre stunts vil hjelpe deg) og ta tak i alle stjernene!",
            nlDescription: "Het is een zonnige dag. Wat dacht je van een leuke motorrit op het strand? Wat kan er misgaan?! Probeer elk level zo snel mogelijk te voltooien (stunts helpen je) en pak alle sterren!",
            plDescription: "Piękny dzień. Co powiesz na przyjemną przejażdżkę motocyklem po plaży? Co może pójść źle?! Postaraj się jak najszybciej ukończyć każdy poziom (wykonywanie sztuczek pomoże Ci) i zdobądź wszystkie gwiazdki!",
            ptDescription: "Está um dia ensolarado. Que tal um passeio agradável de moto na praia? O que poderia dar errado?! Tente completar cada nível o mais rápido possível (fazer acrobacias vai te ajudar) e pegar todas as estrelas!",
            roDescription: "Este o zi însorită. Ce zici de o plimbare plăcută cu motocicleta pe plajă? Ce ar putea merge prost?! Încercați să finalizați fiecare nivel cât mai repede (efectuarea de cascadorii vă va ajuta) și să obțineți toate stelele!",
            ruDescription: "Прекрасный день. Как насчет приятной поездки на мотоцикле по пляжу? Что может пойти не так?! Постарайтесь как можно быстрее пройти каждый уровень (выполнение трюков поможет вам) и собрать все звезды!",

            skDescription: "Pekný slnečný deň. Čo tak príjemná jazda na motorke po pláži? Čo by sa mohlo pokaziť?! Pokúste sa prejsť každú úroveň čo najrýchlejšie (pomôžu vám kúsky) a pozbierajte všetky hviezdičky!",
            slDescription: "Lep sončen dan. Kaj bi rekla sproščena vožnja s motorjem ob morju? Kaj bi lahko šlo narobe?! Poskusite čim prej preteči vsako raven (trikovi vam bodo pomagali) in pograbiti vse zvezde!",
            sqDescription: "Është një ditë me diell. Si për një motor me kënaqësi në plazh? Çfarë mund të shkojë keq?! Provoni të përfundoni çdo nivel sa më shpejtë që të jetë e mundur (bërja e aventurave do t'ju ndihmojë) dhe kapni të gjitha yjet!",
            srDescription: "Sunčani je dan. Šta kažete za prijatnu vožnju motorciklom na plaži? Šta bi sve moglo da pogreši?! Pokušajte da prođete svaki nivo što brže možete (trikovi će vam pomoći) i poberete sve te zvezde!",
            svDescription: "En solig dag. Vad sägs du om en trevlig motorcykeltur på stranden? Vad kan gå fel?! Försök att slutföra varje nivå så snabbt du kan (konster hjälper dig) och ta alla stjärnor!",
            thDescription: "วันแดดออก แสดงว่าไงกับการขี่มอเตอร์ไซค์ริมชายหาดแบบสบายๆ? อะไรจะผิดพลาดได้? พยายามทำแต่ละเลเวลให้เร็วที่สุด (การทำสตั๊นท์จะช่วยคุณ) และเก็บดาวทั้งหมด!",
            trDescription: "Güneşli bir gün. Plajda keyifli bir motorsiklet yolculuğu ne dersiniz? Ne ters gidebilir ki? Her bölümü olabildiğince çabuk tamamlamaya çalışın (dublörlükler size yardımcı olur) ve tüm yıldızları toplayın!",
            ukDescription: "Гарний сонячний день. А що щодо приємної їзди на мотоциклі по пляжу? Що може піти не так?! Намагайтеся проходити кожен рівень якомога швидше (трюки вам допоможуть) і збирайте всі ці зірки!",
            urDescription: "یہ ایک خوبصورت دن ہے۔ ساحل سمندر پر موٹر سائیکل کی دلچسپ سواری کیسا رہے گی؟ کیا غلط ہو سکتا ہے؟ ہر سطح کو جتنی جلدی ممکن ہو مکمل کرنے کی کوشش کریں (اسٹنٹ آپ کی مدد کریں گے) اور ان تمام ستاروں کو پکڑیں!",
            viDescription: "Một ngày nắng đẹp. Đi chơi mô tô trên bãi biển thì sao nhỉ? Chuyện gì có thể sai được chứ? Hãy cố gắng hoàn thành mỗi màn chơi nhanh nhất có thể (thực hiện các pha nguy hiểm sẽ giúp bạn) và lấy hết tất cả các ngôi sao!",
            zhDescription: "阳光明媚的一天。海滩上骑摩托车怎么样？还能出什么事呢？！ 尽最大努力最快地完成每个关卡（表演特技会帮到你）并抓住所有星星！",

            source: "index-x.html",

        //walkthrough button...
        function isMobileDevice() {
            // 1. Check for common mobile indicators in the User Agent string
            const userAgentCheck = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // 2. Check for touch capabilities
            // This is better than relying on 'ontouchstart' which is often misleading
            const touchCheck = (
                'ontouchstart' in window ||                 // Legacy check for ontouchstart
                navigator.maxTouchPoints > 0 ||             // Modern check for touch points (e.g., modern tablets)
                navigator.msMaxTouchPoints > 0              // IE/Edge specific check
            );

            // Consider it mobile if either check passes
            return userAgentCheck || touchCheck;
        }

        if (isMobileDevice()) {
            console.log("This is likely a mobile or tablet device. Removing walkthrough button due to on-screen conflict.");
            game.walkthrough = "";
        } else {
            console.log("This is likely a desktop device.");
        }
